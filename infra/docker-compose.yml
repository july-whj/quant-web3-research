name: quant-web3-research

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: quant_web3
      MYSQL_USER: quant
      MYSQL_PASSWORD: quant
      MYSQL_ROOT_PASSWORD: local-root-only
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-plocal-root-only"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    environment: &api_environment
      DATABASE_URL: mysql+pymysql://quant:quant@mysql:3306/quant_web3
      REDIS_URL: redis://redis:6379/0
      JOB_MODE: rq
      CREATE_TABLES_ON_STARTUP: "true"
      SIWE_DOMAIN: localhost:8080
      SIWE_URI: http://localhost:8080
      CORS_ORIGINS: http://localhost:8080,http://localhost:5173
      ADMIN_API_KEY: local-development-key
      COLLECTOR_EXCHANGES: binance,okx
      COLLECTOR_SYMBOL: BTC/USDT
      COLLECTOR_TIMEFRAMES: 1m,5m,15m,1h,4h,1d,1w
      BINANCE_REST_URL: https://data-api.binance.vision/api/v3
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - research_data:/workspace/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"]
      interval: 5s
      timeout: 5s
      retries: 20

  worker:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    command: ["python", "-m", "apps.worker.quant_web3_worker.worker"]
    environment: *api_environment
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - research_data:/workspace/data

  collector:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    command: ["python", "-m", "apps.collector.quant_web3_collector.main"]
    environment: *api_environment
    depends_on:
      mysql:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - research_data:/workspace/data

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  mysql_data:
  redis_data:
  research_data:
